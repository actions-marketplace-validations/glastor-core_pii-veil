site_name: GLASTOR® pii-veil Documentation
site_url: https://glastor-core.github.io/pii-veil/
site_description: Sub-millisecond Reversible PII & Secret Anonymizer for LLMs, Agents, Logs & SQL Streams.
repo_url: https://github.com/glastor-core/pii-veil
repo_name: glastor-core/pii-veil
copyright: "Copyright &copy; 2026 GLASTOR® Core"

theme:
  name: material
  palette:
    - scheme: slate
      primary: teal
      accent: emerald
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - content.code.copy
    - content.code.annotate

nav:
  - Overview: index.md
  - Benchmarks & Telemetry: benchmarks.md
  - Compliance & Audits:
      - EU GDPR (Privacy by Design): compliance/gdpr.md
      - US HIPAA (Safe Harbor): compliance/hipaa.md
      - PCI-DSS v4.0 (Cardholder Data): compliance/pci-dss.md
      - Brazil LGPD (Privacidade IA): compliance/lgpd.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - tables
  - attr_list
