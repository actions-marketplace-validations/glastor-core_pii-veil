[package]
name = "pii-veil-py"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Python bindings (PyO3/Maturin) for pii-veil-core"

[lib]
name = "pii_veil"
crate-type = ["cdylib"]

[dependencies]
pii-veil-core = { path = "../veil-core", version = "0.1.0" }
pyo3 = { version = "0.22", features = ["extension-module"] }
