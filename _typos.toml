# Configuration for `typos` (https://github.com/crate-ci/typos)
# Fast, low-false-positive source code and documentation spell checker.

[files]
extend-exclude = [
    "target/**",
    "web/node_modules/**",
    "web/dist/**",
    "Cargo.lock",
    "web/package-lock.json",
    "*.wasm",
    "*.svg",
    "*.enc",
    "*.vault",
    ".vektor/**",
    # Intentional Spanish/Portuguese fixtures and regional test payloads
    "web/src/scripts/playground.ts",
    "docs/compliance/lgpd.md",
    "CONTRIBUTORS.md",
    "crates/veil-core/benches/bench_throughput.rs",
    ".github/COMMIT_CONVENTION.md",
    ".github/PULL_REQUEST_TEMPLATE.md",
]

[default]
extend-ignore-re = [
    # Ignore synthetic tokens, hex hashes, and placeholder tags
    "sk-proj-[A-Za-z0-9]+",
    "0x[0-9A-Fa-f_]+",
    "\\[[A-Z_0-9]+\\]",
]

