name: Security, SemVer & Binary Audit (GLASTOR® Core)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  specter-semver-audit:
    name: Specter — API Contract & SemVer Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Run GLASTOR® Specter API Contract Verification
        uses: glastor-core/specter@v1
        with:
          base-ref: "origin/main"
          fail-on-trojan: "true"
          output-sarif: "specter.sarif"
          output-sbom: "specter-sbom.cdx.json"
          post-pr-comment: "true"
        continue-on-error: true

  byte-gauge-binary-audit:
    name: Byte-Gauge — Release Binary Hardening & Size Gatekeeper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build release artifacts (veil CLI & WebAssembly core)
        run: |
          cargo build --release -p pii-veil-cli
          cargo build --release --target wasm32-unknown-unknown -p pii-veil-wasm
      - name: Run GLASTOR® Byte-Gauge Audit
        uses: glastor-core/byte-gauge@v1
        with:
          file-path: "target/release/veil,target/wasm32-unknown-unknown/release/pii_veil_wasm.wasm"
          scan-entropy-secrets: "true"
          max-size-mb: "15"
          max-entropy: "7.4"
          output-sarif: "byte-gauge.sarif"
          output-sbom: "byte-gauge-sbom.cdx.json"
          post-pr-comment: "true"
        continue-on-error: true
      - name: Upload Byte-Gauge SARIF report to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: "byte-gauge.sarif"

  nemesis-and-veil-dogfooding:
    name: Nemesis SAST & pii-veil Self-Dogfooding DLP Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run GLASTOR® Nemesis DevSecOps Audit
        uses: glastor-core/nemesis@v1
        continue-on-error: true
      - name: Build veil CLI for Self-Dogfooding
        run: cargo build --release -p pii-veil-cli
      - name: Self-Dogfooding — Verify governance & CI configs contain zero leaked secrets
        run: |
          ./target/release/veil scan --file .github/workflows -p veil.json --fail-on-detect
          ./target/release/veil scan --file Cargo.toml -p veil.json --fail-on-detect
