name: Spell Check (typos)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spellcheck:
    name: Check Spelling (crate-ci/typos)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run typos spell checker
        uses: crate-ci/typos@v1.52.2
        with:
          config: _typos.toml
