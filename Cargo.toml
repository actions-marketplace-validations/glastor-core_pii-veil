[workspace]
resolver = "2"
members = ["crates/veil-core", "crates/veil-cli", "crates/veil-ffi", "crates/veil-wasm"]
# Optional language bindings (built via maturin / napi-rs CLI when publishing to PyPI / NPM)
exclude = ["crates/veil-py", "crates/veil-node"]

[workspace.package]
version = "0.1.4"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["GLASTOR Core <founder@glastor.es>"]
repository = "https://github.com/glastor-core/pii-veil"
keywords = ["pii", "anonymization", "dlp", "llm", "mcp"]
categories = ["command-line-utilities", "text-processing", "cryptography"]

[workspace.dependencies]
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive", "env"] }
