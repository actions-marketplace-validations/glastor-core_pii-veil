[package]
name = "bench-pii-veil"
version = "0.1.4"
edition = "2021"

[dependencies]
axum = "0.8"
pii-veil-core = "0.1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
