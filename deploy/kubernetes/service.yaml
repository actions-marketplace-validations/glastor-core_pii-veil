apiVersion: v1
kind: Service
metadata:
  name: ai-service
  labels:
    app: ai-service
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/part-of: glastor-core
spec:
  type: ClusterIP
  selector:
    app: ai-service
  ports:
    - name: http
      port: 80
      targetPort: 3000
    - name: dlp-metrics
      port: 8080
      targetPort: 8080
