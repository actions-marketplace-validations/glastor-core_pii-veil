apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service-with-pii-veil
  labels:
    app: ai-service
    app.kubernetes.io/name: ai-service-with-pii-veil
    app.kubernetes.io/part-of: glastor-core
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/health"
    spec:
      volumes:
        - name: policy-volume
          configMap:
            name: pii-veil-policy
            items:
              - key: veil.json
                path: veil.json

      containers:
        # ====================================================================
        # 1. Main Application Container (Node.js / Python / Go LLM Client)
        # ====================================================================
        - name: app
          image: ghcr.io/glastor-core/example-ai-agent:latest
          env:
            # Route all LLM requests through the local pii-veil sidecar on 127.0.0.1:8080!
            - name: OPENAI_BASE_URL
              value: "http://127.0.0.1:8080/v1"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-credentials
                  key: openai-api-key
          ports:
            - containerPort: 3000
              name: http-app
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

        # ====================================================================
        # 2. GLASTOR® pii-veil Sidecar Proxy Container (< 15 MB Distroless)
        # ====================================================================
        - name: pii-veil-sidecar
          image: ghcr.io/glastor-core/pii-veil:v0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - "proxy"
            - "--listen"
            - "127.0.0.1:8080"
            - "--policy"
            - "/etc/veil/veil.json"
          env:
            - name: VEIL_LISTEN
              value: "127.0.0.1:8080"
            # Optional: Upstream server URL (e.g. Ollama or private gateway)
            # When omitted, echo mode can be enabled or app can route to /v1/chat/completions
            - name: VEIL_UPSTREAM
              value: "api.openai.com:443"
          ports:
            - containerPort: 8080
              name: http-dlp-proxy
          volumeMounts:
            - name: policy-volume
              mountPath: /etc/veil
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2
